<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Top Orange Radiant Rays -->
  <g fill="#ff9900">
    <!-- Left ray -->
    <rect x="25" y="8" width="7" height="15" rx="3.5" transform="rotate(-30 28.5 15.5)" />
    <!-- Center ray -->
    <rect x="46.5" y="2" width="7" height="16" rx="3.5" />
    <!-- Right ray -->
    <rect x="68" y="8" width="7" height="15" rx="3.5" transform="rotate(30 71.5 15.5)" />
  </g>

  <!-- Blue Power On Switch -->
  <g fill="#0070f3">
    <!-- Outer Arc / Open Circle -->
    <path
      d="M 33 42 A 26 26 0 1 0 67 42"
      fill="none"
      stroke="#0070f3"
      stroke-width="12"
      stroke-linecap="round"
    />
    <!-- Center Vertical Switch Bar -->
    <rect x="44" y="23" width="12" height="26" rx="6" />
  </g>
</svg>
